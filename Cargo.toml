[workspace]
members = ["server_core", "server_bin"]
resolver = "2"

# Temporary patch for https://github.com/FlorianUekermann/rustls-acme/issues/92
# Let's Encrypt now sends dns-persist-01 challenges without a `token` field,
# which breaks deserialization of the entire challenge list. The fix adds
# #[serde(default)] to the token field. Remove this patch once a fixed version
# is released and update rustls-acme in server_core/Cargo.toml and remove this section.
[patch.crates-io]
rustls-acme = { path = "patches/rustls-acme" }

[profile.release]
strip = true          # strip debug symbols (~1MB saving)
lto = true            # link-time optimisation: dead code elimination across crates
codegen-units = 1     # single codegen unit enables better LTO (slower compile, smaller binary)
opt-level = "z"       # optimise for binary size rather than speed
panic = "abort"       # remove panic-unwind machinery (~50-100KB saving)
